<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      overflow: hidden;
    }

    /* 背景动态光斑 */
    .blob {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }
    .blob-1 { background: #6366f1; top: 15%; left: 20%; }
    .blob-2 { background: #ec4899; bottom: 15%; right: 20%; animation-delay: -4s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    /* 主卡片 - 玻璃质感 */
    .card {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 400px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.4);
    }

    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p.bio { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }

    .links { display: flex; flex-direction: column; gap: 12px; }
    .link-btn {
      display: block;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }
    .link-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }

    .footer { margin-top: 28px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="avatar">🚀</div>
    <h1>我的全栈之旅</h1>
    <p class="bio">Web 开发者 / 探索 Cloudflare 边缘计算中</p>

    <div class="links">
      <a href="https://github.com" target="_blank" class="link-btn">🐙 我的 GitHub 仓库</a>
      <a href="https://cloudflare.com" target="_blank" class="link-btn">☁️ Cloudflare Pages 托管</a>
      <a href="javascript:void(0)" onclick="alert('欢迎来到我的 Cloudflare 第一课！')" class="link-btn">✨ 点我测试 JS 交互</a>
    </div>

    <div class="footer">Hosted on Cloudflare Pages ⚡</div>
  </div>
</body>
</html>
